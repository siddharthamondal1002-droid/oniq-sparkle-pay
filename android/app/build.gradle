apply plugin: 'com.android.application'

android {
    namespace = "com.oniqhub.app"
    compileSdk = rootProject.ext.compileSdkVersion

    // NOT for compiling anything — this project has no native sources. AGP
    // needs an NDK on hand only to run llvm-strip/objcopy over the .so files
    // that arrive inside dependency AARs, which is how debugSymbolLevel below
    // gets anything to package. AGP looks for its own default NDK version and
    // gives up quietly when that exact version is absent, so CI tells us which
    // one it actually installed instead. Unset locally: a developer build has
    // no reason to care, and demanding a specific NDK to compile a Java-only
    // shell would be a gratuitous setup step.
    def ndkFromCi = System.getenv("ONIQ_NDK_VERSION")
    if (ndkFromCi) {
        ndkVersion = ndkFromCi
    }

    defaultConfig {
        applicationId "com.oniqhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 17
        versionName "1.8.3"
        // ----- 1.8.3 -----
        // THE FIRST BUILD SINCE 15 THAT A USER CAN FEEL, AND THE ONLY ONE THAT
        // COULD HAVE FIXED THIS.
        //
        // The chat thread collapsed to a strip whenever the keyboard opened:
        // header, a sliver of messages, the composer, then a dead grey band
        // exactly one keyboard tall. Four fixes were attempted on the web side
        // on 2026-08-18 and all four were in the wrong layer — the note in 16
        // below asserting the cause was "the viewport meta" is wrong, and the
        // device disproved it.
        //
        // The chat probe, from the phone, with no interactive-widget anywhere
        // in the page: screenH 832, innerH 211, vvH 0. Half an hour after the
        // publish that removed the flag, the WebView was still a quarter of
        // the screen. Nothing in the web layer was ever going to move that.
        //
        // MainActivity was padding the content view by the full IME inset on
        // top of a window the system had ALREADY resized for the same
        // keyboard. It now pads only the part the window has not taken, which
        // is correct whether or not a given device resizes.
        //
        // Native, so it reaches nobody until this bundle is installed.
        //
        // ----- code 16 -----
        // A FRESH BUILD OF THE SAME APP. Asked for 2026-08-18, after 15 had
        // already been uploaded to Play; the code goes up because Play rejects
        // a duplicate outright, and a skipped code costs nothing.
        //
        // THE NAME DOES NOT MOVE, AND THIS ONE IS WORTH BEING BLUNT ABOUT: not
        // one line of android/ has changed since 15. Every fix of that day —
        // the chat keyboard, the doubled status-bar inset, the doodle overflow,
        // and the viewport meta that was subtracting the keyboard twice — is
        // web, and the shell loads https://oniqhub.com at runtime. Those fixes
        // reached phones through the Lovable publish the moment it went out.
        // This binary is byte-for-byte the same app as 15 in everything a user
        // can feel, which is precisely the case the rule below exists for.
        //
        // ----- 1.8.2 -----
        // versionCode 15, SAME NAME. 14 was uploaded to Play and a version
        // code cannot be reused, so a fresh bundle needs a fresh code even
        // when not one line of app code has moved. The name stays 1.8.2
        // because nothing a user can see differs between 14 and 15 — they are
        // the same build of the same commit.
        //
        // ----- 1.8.2 -----
        // 1.8.2 EXISTS TO START. 1.8.1 (code 12) crashes on open — "ONIQ keeps
        // stopping", immediately, reported 2026-08-17. Codes 12 and 13 must
        // not be rolled out.
        //
        // The name moves this time, unlike 13, because something a user can
        // feel HAS changed: on 12 the app does not open and on this one it
        // does. See buildTypes.release (R8 off) and MainActivity's guarded
        // EdgeToEdge call for the two suspects and what was ruled out.
        //
        // ----- 1.8.1 -----
        // versionCode 13, STILL NAMED 1.8.1. Code 12 was uploaded, so it is
        // burned and Play would reject a repeat. The NAME does not move
        // because nothing a user can see or feel changed: the only difference
        // between 12 and 13 is native debug symbols in the bundle's metadata,
        // which is stripped out before anything is delivered to a device. See
        // buildTypes.release below for why 12 needed replacing at all.
        //
        // ----- 1.8.1 -----
        // 1.8.1 answers the three things Play flagged on release 11 (1.8):
        //   - "uses deprecated APIs or parameters for edge-to-edge" and
        //     "edge-to-edge may not display for all users" — MainActivity was
        //     calling four window setters that are deprecated in API 35 and
        //     NO-OPS at this app's targetSdk of 36. Replaced with
        //     EdgeToEdge.enable(), which also covers minSdk 24 where those
        //     setters were still doing real work.
        //   - "improve memory and performance with R8" — the release build
        //     shipped unminified. R8 and resource shrinking are on, with keep
        //     rules for the reflective Capacitor surface and a CI check that
        //     reads R8's usage report to prove they held.
        //
        // ----- 1.8 -----
        // 1.8 IS A REAL RELEASE — three things that a web publish CANNOT
        // deliver, all of them native and all shipped since 1.7.1:
        //
        //   6a7a9d3e  the system font scale is honoured. An Android WebView
        //             ignores it unless setTextZoom() is called, so every
        //             accessibility text-size setting on the device did
        //             nothing to this app. Installed 1.7.1 still ignores it.
        //   2ec5ab3a  real edge-to-edge. The shell stopped consuming window
        //             insets before the WebView could see them, so
        //             env(safe-area-inset-*) read 0 and the bars are now
        //             transparent with the cutout handled in values-v27.
        //   e16e8a83  MessagingStyle notifications, grouping, and clearing a
        //             conversation once it is read — NotificationTrayPlugin
        //             and OniqMessagingService are new native classes.
        //
        // Everything ELSE from the last day is web and is already on devices
        // through the publish, needing no build at all: the Story dry-run
        // work, and group calls going free with no participant cap (owner
        // directive 2026-08-16). This shell loads https://oniqhub.com and
        // bundles no web assets, so naming those here would be taking credit
        // in a binary that does not contain them.
        //
        // ----- previous -----
        // 1.7.1 WAS A REBUILD, NOT A RELEASE. Nothing native changed since 1.7:
        // this shell loads https://oniqhub.com (capacitor.config.json server.url),
        // so it bundles no web assets, and everything shipped on 2026-08-15 after
        // the 1.7 build — classic withdrawn, the call filters, the gallery photo
        // and face tracking, the Save/Share ENOENT fix, the filter-chip layout,
        // the web-push key rotation — reached devices through the web publish and
        // is already running inside the installed 1.7.
        //
        // The name says .1 rather than 1.8 for exactly that reason: a version
        // name that promises new capability on a binary with none is a lie the
        // next person has to unpick.
        //
        // The CODE still goes up, because 9 may already be uploaded and Play
        // rejects a duplicate outright. A skipped code costs nothing; a repeated
        // one costs an upload.
        //
        // 1.7 carried native work that a web publish cannot deliver: the
        // @capacitor/share and @capacitor/filesystem plugins, without which the
        // Share and Save buttons under Lores were dead controls on an installed
        // build — the web calls them, the shell had nothing to answer with.
        //
        // versionCode 9 because 8 WAS UPLOADED (1.6, 2026-08-11). Play rejects a
        // duplicate code outright, and a build that cannot be uploaded is a build
        // that did not happen. The code goes up on every AAB that leaves here,
        // whether or not the version name changes.
        //
        // 1.6 shipped SpeakerRouter's audio focus and volume-rocker routing, and
        // MediaSaver publishing into the device's Movies collection.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def ks = System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEYSTORE") ?: project.findProperty("ONIQ_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEYSTORE_PASSWORD") ?: project.findProperty("ONIQ_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEY_ALIAS") ?: project.findProperty("ONIQ_KEY_ALIAS")
                keyPassword System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEY_PASSWORD") ?: project.findProperty("ONIQ_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // R8 IS OFF, AND STAYS OFF UNTIL SOMEBODY CAN TEST IT ON A PHONE.
            //
            // 1.8.1 (version code 12) was the first minified build. It does
            // not start: "ONIQ keeps stopping", immediately on open, reported
            // 2026-08-17. 1.8 (version code 11), which differs from it in
            // exactly two things — this block and EdgeToEdge below — starts
            // fine, so one of those two is the cause.
            //
            // WHAT WAS RULED OUT, so nobody re-runs it. The shipped APK was
            // pulled apart and its dex parsed: all six @capacitor plugins are
            // present under their exact names, all of com.oniqhub.app is
            // present, and — the decisive one — the dex has ZERO class types
            // that are referenced but not defined. There is no
            // NoClassDefFoundError to find. The keep rules held. Whatever
            // breaks is subtler: a method reached by name, an optimisation, or
            // a shrunk resource, and none of those can be identified from a
            // build server with no device attached.
            //
            // SO THIS IS NOT A FIX FOR THE CRASH — it is a return to the
            // configuration that is known to work. R8 was turned on for a Play
            // Console RECOMMENDATION ("improve your app's memory and
            // performance with R8"), which is advice, not a requirement to
            // publish. Trading a working app for it is a bad deal, and
            // debugging a whole-program transform by uploading builds to
            // strangers is a worse one.
            //
            // TO TURN IT BACK ON: set both flags, install the resulting APK on
            // a real device, open it, and read `adb logcat` — one run with a
            // stack trace settles in a minute what three builds could not.
            // Try `-dontobfuscate` first: renaming is the half most likely to
            // break Capacitor's reflective bridge, and shrinking without it
            // still gets most of the size.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // NATIVE DEBUG SYMBOLS — Play warned on version code 12: "This App
            // Bundle contains native code, and you've not uploaded debug
            // symbols."
            //
            // This app writes no NDK code of its own; there is no jniLibs
            // directory and no CMake. The .so files arrive inside dependency
            // AARs, which is why the bundle reports four ABIs for a shell that
            // is almost entirely Java. Symbols we did not author are exactly
            // the ones worth keeping: a crash inside a library binary is
            // unreadable without them, and unlike our Java there is no source
            // to fall back on.
            //
            // FULL rather than SYMBOL_TABLE because the cost is not paid by
            // users. Symbols land in BUNDLE-METADATA/, which Play strips when
            // it generates the split APKs — the metadata never reaches a
            // device, so install size is untouched and only the upload is
            // bigger. SYMBOL_TABLE (function names only, no line numbers) is
            // the smaller option if that upload ever becomes a problem.
            //
            // MEASURED, AND IT CHANGES NOTHING TODAY. Runs 28-30 read the ELF
            // section tables of the merged inputs: every copy of
            // libdatastore_shared_counter.so — the only native library in this
            // bundle, arriving via androidx.datastore under Firebase Messaging
            // — carries .dynsym and nothing else. No .symtab, no .debug_*.
            // androidx publishes it stripped, the pre-strip and post-strip
            // copies are byte-identical, and AGP's extract task writes an
            // empty directory without complaint.
            //
            // So Play's recommendation on version code 12 CANNOT be satisfied
            // from this repository. It is a recommendation, not a release
            // blocker, and the honest options are to live with it or to drop
            // the library from the bundle with a packaging exclude — which
            // would risk UnsatisfiedLinkError inside a dependency to save
            // ~23 KB, and is the owner's call, not an engineering one.
            //
            // The setting stays because it is correct and costs nothing: the
            // day any dependency ships an unstripped .so, symbols get packaged
            // with no further work. android-build.yml checks the finished .aab
            // and fails only when a library that HAD symbols shipped without
            // them — the regression worth catching — rather than failing
            // forever on libraries nobody can fix.
            ndk {
                debugSymbolLevel = 'FULL'
            }
            if (System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // EXPLICIT, not transitive. EdgeToEdge lives here, and it arrives via
    // appcompat today only by accident of that library's own dependencies —
    // an appcompat bump could drop it and break the build for a reason with
    // no obvious connection to the change that caused it.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
