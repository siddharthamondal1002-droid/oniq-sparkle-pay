apply plugin: 'com.android.application'

android {
    namespace = "com.oniqhub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.oniqhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.8"
        // 1.8 IS A REAL RELEASE — three things that a web publish CANNOT
        // deliver, all of them native and all shipped since 1.7.1:
        //
        //   6a7a9d3e  the system font scale is honoured. An Android WebView
        //             ignores it unless setTextZoom() is called, so every
        //             accessibility text-size setting on the device did
        //             nothing to this app. Installed 1.7.1 still ignores it.
        //   2ec5ab3a  real edge-to-edge. The shell stopped consuming window
        //             insets before the WebView could see them, so
        //             env(safe-area-inset-*) read 0 and the bars are now
        //             transparent with the cutout handled in values-v27.
        //   e16e8a83  MessagingStyle notifications, grouping, and clearing a
        //             conversation once it is read — NotificationTrayPlugin
        //             and OniqMessagingService are new native classes.
        //
        // Everything ELSE from the last day is web and is already on devices
        // through the publish, needing no build at all: the Story dry-run
        // work, and group calls going free with no participant cap (owner
        // directive 2026-08-16). This shell loads https://oniqhub.com and
        // bundles no web assets, so naming those here would be taking credit
        // in a binary that does not contain them.
        //
        // ----- previous -----
        // 1.7.1 WAS A REBUILD, NOT A RELEASE. Nothing native changed since 1.7:
        // this shell loads https://oniqhub.com (capacitor.config.json server.url),
        // so it bundles no web assets, and everything shipped on 2026-08-15 after
        // the 1.7 build — classic withdrawn, the call filters, the gallery photo
        // and face tracking, the Save/Share ENOENT fix, the filter-chip layout,
        // the web-push key rotation — reached devices through the web publish and
        // is already running inside the installed 1.7.
        //
        // The name says .1 rather than 1.8 for exactly that reason: a version
        // name that promises new capability on a binary with none is a lie the
        // next person has to unpick.
        //
        // The CODE still goes up, because 9 may already be uploaded and Play
        // rejects a duplicate outright. A skipped code costs nothing; a repeated
        // one costs an upload.
        //
        // 1.7 carried native work that a web publish cannot deliver: the
        // @capacitor/share and @capacitor/filesystem plugins, without which the
        // Share and Save buttons under Lores were dead controls on an installed
        // build — the web calls them, the shell had nothing to answer with.
        //
        // versionCode 9 because 8 WAS UPLOADED (1.6, 2026-08-11). Play rejects a
        // duplicate code outright, and a build that cannot be uploaded is a build
        // that did not happen. The code goes up on every AAB that leaves here,
        // whether or not the version name changes.
        //
        // 1.6 shipped SpeakerRouter's audio focus and volume-rocker routing, and
        // MediaSaver publishing into the device's Movies collection.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def ks = System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEYSTORE") ?: project.findProperty("ONIQ_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEYSTORE_PASSWORD") ?: project.findProperty("ONIQ_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEY_ALIAS") ?: project.findProperty("ONIQ_KEY_ALIAS")
                keyPassword System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEY_PASSWORD") ?: project.findProperty("ONIQ_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ORG_GRADLE_PROJECT_ONIQ_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
