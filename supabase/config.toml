project_id = "bqwttemnnoexadpwifcj"

# The Story functions authenticate themselves, so the platform gate is off.
#
# THIS IS NOT A RELAXATION. Every one of them refuses an unauthenticated caller
# in its own first lines; the gateway check is turned off because the callers
# are not users and cannot present a user JWT for it to check:
#
#   story-callback  the runner holds an HMAC capability token naming ONE job for
#                   ONE hour, verified with a constant-time compare before the
#                   service role is used on its behalf. It has no Supabase key,
#                   so there is no JWT for the gateway to inspect.
#   story-dispatch  called by pg_cron with the service-role key, which it
#                   compares itself. A service key is not a user JWT either.
#   story-plot      each checks Authorization against /auth/v1/user for a real
#   story-still     person, OR accepts x-story-job-token from the runner. Both
#   story-voice     branches are in requireAuth(); neither is skippable.
#   story-clip      image-to-video is only ever a runner step, never a
#                   user-facing call, so it authenticates SOLELY by the same
#                   x-story-job-token — verifyJobToken(): HMAC-SHA256 over one
#                   job id, 1-hour TTL, constant-time compare, expiry checked
#                   after the signature. In dispatched mode the runner sends no
#                   Authorization header at all, so leaving verify_jwt on here
#                   makes the gateway 401 the runner before the function's own
#                   token check ever runs — which is exactly the break this
#                   line fixes. The job-token gate is strictly stronger than a
#                   user JWT for a machine caller.
#
# Leaving verify_jwt on here would not add a check — it would break the runner
# and leave the user path exactly as guarded as it already is.
[functions.story-callback]
verify_jwt = false

[functions.story-dispatch]
verify_jwt = false

[functions.story-plot]
verify_jwt = false

[functions.story-still]
verify_jwt = false

[functions.story-voice]
verify_jwt = false

[functions.story-clip]
verify_jwt = false

# story-motion — ONIQ's OWN LTX motion transport, and the reason movies have
# never animated. It is the in-house twin of story-clip: the runner is its only
# caller, it authenticates SOLELY by x-story-job-token (verifyJobToken, HMAC over
# one job id, 1-hour TTL, constant-time compare), and in dispatched mode the
# runner sends no Authorization header at all.
#
# MEASURED 2026-08-29, story job fce10e2d. The clip stage fired correctly on six
# shots — "motion 4: WALKING/WALK — clip REQUESTED" — and every one of them came
# back
#     story-motion: 404 {"code":"NOT_FOUND","message":"Requested function was not found"}
# so the film fell back to stills and reported 0/9 shots with a character-motion
# source. Not weak animation: NO animation. The function was written, committed,
# and never declared here, so it was never deployed. LTX has not run once.
#
# Same reasoning as story-clip above, for the same shape of caller: leaving
# verify_jwt on would 401 the runner at the gateway before the function's own
# stronger token check could run.
[functions.story-motion]
verify_jwt = false

# Called by pg_cron with the service-role key, which it compares itself — same
# shape as story-dispatch, and a service key is not a user JWT.
[functions.story-sweep]
verify_jwt = false

# story-deliver is DELIBERATELY ABSENT from this list. Its caller is a signed-in
# person asking for their own film, so it has a real user JWT to present and the
# platform gate should check it. The function then re-derives the user from that
# token and refuses unless the job's user_id matches — a job id is a uuid, not a
# secret, and one check is not two.

# Razorpay cannot present a Supabase user JWT, so the webhook authenticates
# itself: the x-razorpay-signature HMAC over the raw body IS the credential,
# checked before the body is parsed. Leaving verify_jwt on would simply reject
# every webhook — Razorpay has no way to satisfy it.
[functions.razorpay-webhook]
verify_jwt = false

# razorpay-order and razorpay-verify are DELIBERATELY ABSENT from this file.
# Both are called by a signed-in person spending their own money, so they have
# a real user JWT and the platform gate should check it. Each then re-derives
# the user from that token and refuses unless the order and the payment attempt
# belong to them — a signature proves a payment happened, not whose it was.

# FIREBASE AUTH AS A THIRD-PARTY IDENTITY PROVIDER. Owner directive
# 2026-09-05: identity moves to Firebase while Postgres stays the system of
# record. This block is what makes Supabase accept a Firebase ID token, so
# auth.uid() resolves to the token's `sub` and all 242 RLS policies keep
# working unchanged.
#
# IT IS ADDITIVE. Supabase Auth keeps issuing sessions exactly as before;
# enabling this only widens what is ACCEPTED. Turning it on before any user
# exists in Firebase changes nothing for anybody, which is why it goes first.
#
# THE UID IS THE SAFETY PROPERTY. auth.uid() casts the `sub` claim to uuid,
# and every one of those policies compares it against uuid columns, so a
# native Firebase uid would not merely fail to match — it would fail to
# cast. importUsers() takes a caller-specified uid of up to 128 characters,
# and all 125 production ids are UUIDs of 36, so each user is imported
# carrying the id they already have. See scripts/firebase-import-users.mjs.
#
# NO RESTRICTIVE RLS POLICIES ARE NEEDED HERE, and the reason is specific:
# Firebase signs every project's tokens with ONE shared set of keys, so a
# token from an unrelated Firebase project is cryptographically valid. On
# SELF-HOSTED Supabase that is your problem to guard with `as restrictive`
# policies on every table, bucket and channel. ONIQ is on the HOSTED
# platform, which rejects tokens whose project id is not registered here
# before they ever reach Postgres. Moving off hosted would make those 142
# tables' policies load-bearing overnight.
[auth.third_party.firebase]
enabled = true
project_id = "oniq-309bd"

# The Firebase phone exchange authenticates ITSELF, on the token's signature.
# The caller is not signed in yet — that is the point of the endpoint — so a
# gateway JWT check would reject every legitimate request before the function's
# own, far stronger, check could run.
[functions.firebase-phone-session]
verify_jwt = false
