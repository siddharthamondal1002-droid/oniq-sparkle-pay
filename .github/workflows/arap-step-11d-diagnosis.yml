name: arap step 11d diagnosis

# Step 11D — DIAGNOSE Step 11C's two failed WALKING renders, and write the
# result as ONE PDF at the workspace root:
#   $GITHUB_WORKSPACE/ONIQ_Step_11D_Diagnosis_Report.pdf
#
# The question: the existing render gate said "left the frame or vanished"
# for both eligible gateway characters. Is that the ARAP deform drifting a
# figure off its ground, or the BVH root carrying a correct figure out of a
# fixed camera's view? Two things separate the readings and both are here:
#   1. per-frame silhouette trajectories (centroid, height, width, fill) of
#      each gateway character's render, split at the first edge contact;
#   2. the SAME driver rendered on the reference character the image ships
#      (the 11A benchmark), measured the same way. If the reference walks
#      out too, the walk-off belongs to the driver and the camera, not to
#      the gateway characters.
#
# Same validated digest, pulled read-only; every script mounted, none baked;
# the gate applied is the existing l3RenderQc; the diagnosis parameters are
# analysis parameters, not gates. A reading here ENABLES NOTHING.
#
# One credential: GITHUB_TOKEN, packages:read, to pull from GHCR.

on:
  # A push of this stage to the working branch runs it once, with the defaults
  # below, so the diagnosis exists before anything is merged. Dispatch by hand
  # for any other stems or motion.
  push:
    branches: [claude/check-56jtg5]
    paths:
      - ".github/workflows/arap-step-11d-diagnosis.yml"
      - "runtime/arap-cpu/qc/walking_diagnosis.py"
      - "runtime/arap-cpu/qc/diagnosis_report.py"
  workflow_dispatch:
    inputs:
      corpus_manifest:
        description: "Repo path of the committed oniq.arap-corpus-manifest/1."
        type: string
        default: "remotion/fixtures/arap-eligibility/corpus/OWNER_AUTHORIZED_GATEWAY_CORPUS.manifest.json"
      stems:
        description: "Comma-separated still stems to diagnose — the eligible primaries from the measurement."
        type: string
        default: "87c2b756-a832-48dc-b97b-7a3235ddee5c-s-shot002,87c2b756-a832-48dc-b97b-7a3235ddee5c-s-shot004"
      motion:
        description: "Motion config inside the Animated Drawings checkout. WALKING is the only grammar entry."
        type: string
        default: "examples/config/motion/zombie.yaml"

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    name: "separate deform drift from the driver's translation, with the reference beside"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: "The image is the validated digest, and nothing else"
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(python3 -c "import json;print(json.load(open('runtime/arap-cpu/pins.json'))['validation']['image_build']['digest'])")
          case "$DIGEST" in *@sha256:*) ;; *) echo "FAIL: not a digest reference: $DIGEST"; exit 1;; esac
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "IMAGE UNDER DIAGNOSIS: ${DIGEST}"

      - name: "Pull by digest"
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | docker --config /tmp/dc login ghcr.io -u "${REGISTRY_USER}" --password-stdin >/dev/null
          docker --config /tmp/dc pull "${DIGEST}"
          rm -rf /tmp/dc
          docker image inspect "${DIGEST}" --format 'PULLED {{index .RepoDigests 0}}'

      - name: "The driver, on record"
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          MOTION: ${{ inputs.motion || 'examples/config/motion/zombie.yaml' }}
        run: |
          set -euo pipefail
          echo "::group::${MOTION} (from inside the image)"
          docker run --rm --entrypoint cat "${DIGEST}" "/opt/oniq/AnimatedDrawings/${MOTION}"
          echo "::endgroup::"
          echo "::group::retarget config (repository copy the image carries)"
          cat remotion/scripts/retarget_armdamped_reference.yaml
          echo "::endgroup::"

      - name: "The corpus, by derived key, from the owner's manifest"
        env:
          CORPUS_MANIFEST: ${{ inputs.corpus_manifest || 'remotion/fixtures/arap-eligibility/corpus/OWNER_AUTHORIZED_GATEWAY_CORPUS.manifest.json' }}
        run: |
          set -euo pipefail
          mkdir -p corpus out/qc && chmod 0777 corpus out out/qc
          test -f "${CORPUS_MANIFEST}"
          python3 runtime/arap-cpu/measure/fetch_corpus.py --selftest
          python3 runtime/arap-cpu/measure/fetch_corpus.py "${CORPUS_MANIFEST}" corpus
          cp corpus/corpus-manifest.json out/corpus-manifest.fetched.json

      - name: "Gateway characters: rig, silhouette, WALKING render, statistics, diagnosis"
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          STEMS: ${{ inputs.stems || '87c2b756-a832-48dc-b97b-7a3235ddee5c-s-shot002,87c2b756-a832-48dc-b97b-7a3235ddee5c-s-shot004' }}
          MOTION: ${{ inputs.motion || 'examples/config/motion/zombie.yaml' }}
        run: |
          set -euo pipefail
          run_in_image() {
            docker run --rm -e TQDM_DISABLE=1 ${ENTRYPOINT:+--entrypoint "${ENTRYPOINT}"} \
              -v "${PWD}/corpus:/corpus:ro" \
              -v "${PWD}/runtime/arap-cpu/qc:/qc:ro" \
              -v "${PWD}/out/qc:/work" \
              "${DIGEST}" "$@"
          }
          IFS=',' read -ra LIST <<< "${STEMS}"
          for raw in "${LIST[@]}"; do
            stem="$(echo "${raw}" | tr -d '[:space:]')"
            [ -n "${stem}" ] || continue
            case "${stem}" in *[!A-Za-z0-9_-]*) echo "FAIL: stem ${stem} is not a plain id"; exit 1;; esac
            echo "::group::${stem}"
            mkdir -p "out/qc/${stem}" && chmod 0777 "out/qc/${stem}"
            if [ ! -f "corpus/${stem}.png" ]; then
              echo "NO STILL for ${stem} (not fetched — see the corpus step)"
              echo "::endgroup::"; continue
            fi
            run_in_image rig "/corpus/${stem}.png" "/work/${stem}/char" | tee "out/qc/${stem}/rig.log" || { echo "rig failed for ${stem}"; echo "::endgroup::"; continue; }
            grep -m1 '"status": "RIGGED"' "out/qc/${stem}/rig.log" > "out/qc/${stem}/rig.json" || true
            run_in_image segment "/work/${stem}/char/texture.png" "/work/${stem}/seg" || { echo "segment failed for ${stem}"; echo "::endgroup::"; continue; }
            ENTRYPOINT=cp run_in_image "/work/${stem}/seg/mask.png" "/work/${stem}/char/mask.png" || { echo "mask copy failed for ${stem}"; echo "::endgroup::"; continue; }
            run_in_image render "/work/${stem}/char" "/opt/oniq/AnimatedDrawings/${MOTION}" "/work/${stem}/walk.gif" || { echo "render failed for ${stem}"; echo "::endgroup::"; continue; }
            run_in_image shell-b /qc/walking_qc_stats.py "/work/${stem}/walk.gif" "/work/${stem}/stats.json" || echo "stats failed for ${stem}"
            run_in_image shell-b /qc/walking_diagnosis.py "/work/${stem}/walk.gif" "/work/${stem}" --label "${stem##*-s-}" || echo "diagnosis failed for ${stem}"
            echo "::endgroup::"
          done

      - name: "Reference character: the same driver, the same measurements"
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          MOTION: ${{ inputs.motion || 'examples/config/motion/zombie.yaml' }}
        run: |
          set -euo pipefail
          mkdir -p out/qc/reference-char1 && chmod 0777 out/qc/reference-char1
          echo "::group::reference-char1"
          docker run --rm -e TQDM_DISABLE=1 -e ONIQ_ARAP_MOTION="/opt/oniq/AnimatedDrawings/${MOTION}" \
            -v "${PWD}/runtime/arap-cpu/qc:/qc:ro" -v "${PWD}/out/qc:/work" \
            "${DIGEST}" benchmark /work/reference-char1/walk.gif || echo "reference benchmark reported a failure (its own floors); the clip is still measured below"
          docker run --rm -e TQDM_DISABLE=1 -v "${PWD}/runtime/arap-cpu/qc:/qc:ro" -v "${PWD}/out/qc:/work" \
            "${DIGEST}" shell-b /qc/walking_qc_stats.py /work/reference-char1/walk.gif /work/reference-char1/stats.json || echo "stats failed for the reference"
          docker run --rm -e TQDM_DISABLE=1 -v "${PWD}/runtime/arap-cpu/qc:/qc:ro" -v "${PWD}/out/qc:/work" \
            "${DIGEST}" shell-b /qc/walking_diagnosis.py /work/reference-char1/walk.gif /work/reference-char1 --label reference-char1 || echo "diagnosis failed for the reference"
          echo "::endgroup::"

      - name: "Judge with the existing gate, unchanged"
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsx scripts/arap-walking-qc.ts out/qc out/qc/verdicts.json | tee out/qc/summary.txt

      - name: "The report, as one PDF at the workspace root"
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet pillow
          python3 runtime/arap-cpu/qc/diagnosis_report.py out/qc "${GITHUB_WORKSPACE}/ONIQ_Step_11D_Diagnosis_Report.pdf" \
            --digest "${DIGEST}" --run-url "${RUN_URL}" \
            --extra "corpus=OWNER_AUTHORIZED_GATEWAY_CORPUS, owner-only, the two eligible primaries of the 2026-08-31 film" \
            --extra "gate=l3RenderQc default thresholds; diagnosis parameters are analysis parameters, not gates"
          cp "${GITHUB_WORKSPACE}/ONIQ_Step_11D_Diagnosis_Report.pdf" out/
          python3 runtime/arap-cpu/qc/diagnosis_report.py --build-transfer out/qc out/transfer.json --digest "${DIGEST}" --run-url "${RUN_URL}"
          cp "${GITHUB_WORKSPACE}/ONIQ_Step_11D_Diagnosis_Report.html" out/ 2>/dev/null || true
          ls -l "${GITHUB_WORKSPACE}/ONIQ_Step_11D_Diagnosis_Report.pdf"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arap-step-11d-diagnosis
          path: out/
          if-no-files-found: error

      - name: "The readings, last"
        if: always()
        run: |
          echo "IMAGE: ${{ steps.digest.outputs.digest }}"
          cat out/qc/summary.txt 2>/dev/null || echo "(no gate summary — see the steps above)"
          for d in out/qc/*/diagnosis.json; do
            [ -f "$d" ] || continue
            echo "::group::$(basename "$(dirname "$d")") diagnosis"
            python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))['diagnosis'], indent=1))" "$d"
            echo "::endgroup::"
          done
          echo "PDF: ${GITHUB_WORKSPACE}/ONIQ_Step_11D_Diagnosis_Report.pdf (also in the arap-step-11d-diagnosis artifact)"
          if [ -f out/transfer.json ]; then
            # Everything the PDF needs, carried in the log so a session that cannot
            # reach the artifact store can rebuild and check in the same report.
            echo "::group::transfer.json"; cat out/transfer.json; echo; echo "::endgroup::"
          fi
          echo "NOTE: a reading here enables nothing. Pose-warp stays disabled in the planner; no provider is registered."
