name: extract actor validation frames

# One-off helper for the 43-shot owner-actor visual acceptance (job 5871421e).
# A runner can reach Supabase storage; the dev container cannot. Downloads the
# rendered MP4 with the repo's storage credentials (same secrets the story
# worker uploads with — they never leave Actions), cuts representative frames
# across the actor-conditioned shots plus the sheet-refused tail, and commits
# them to a scratch branch for inspection. Deleted after use, same as the
# 838bd9e6 extractor before it. Touches no product code or config.
on:
  workflow_dispatch:
    inputs:
      storage_path:
        description: Storage object path of the rendered mp4
        required: true
        default: stories/5871421e-c298-45e7-a6db-746f7486424a.mp4
      out_branch:
        description: Branch to commit the frames to
        required: true
        default: val-5871421e

jobs:
  frames:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: download + extract
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          curl -sSL -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/storage/v1/object/${{ github.event.inputs.storage_path }}" -o film.mp4
          ls -la film.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 film.mp4
          mkdir -p frames
          # 43 shots over 232.1s ≈ 5.398 s/shot; shot N centre ≈ (N-0.5)*5.398.
          # Conditioned shots 1–38 (kind:scene, generationConditioned:true in
          # the worker log); 39–43 are the sheet-refused, text-only tail.
          grab () { ffmpeg -v error -ss "$1" -i film.mp4 -frames:v 1 -vf scale=640:-1 -q:v 3 "frames/$2" -y; }
          grab 3.0   shot01_title.jpg        # opening + title card
          grab 8.1   shot02.jpg              # early conditioned
          grab 29.7  shot06.jpg
          grab 51.3  shot10.jpg
          grab 78.3  shot15.jpg
          grab 105.3 shot20_glass_a.jpg      # glassblower-night ref (log: attached)
          grab 107.6 shot20_glass_b.jpg      # +2.3s motion pair
          grab 126.9 shot24_fiddler.jpg      # irish-pub-fiddler ref
          grab 143.0 shot27_flamenco_a.jpg   # seville-flamenco-dancer ref
          grab 145.3 shot27_flamenco_b.jpg   # +2.3s motion pair
          grab 153.8 shot29_stepdown.jpg     # the 422 step-down retry shot
          grab 170.1 shot32_balinese.jpg     # balinese-dancer ref
          grab 191.6 shot36_baker.jpg        # mediterranean-baker ref
          grab 207.8 shot39_sheet.jpg        # sheet-refused, text-only
          grab 213.2 shot40_sheet.jpg        # sheet-refused, text-only
          grab 229.4 shot43_close.jpg        # closing wide, sheet-refused
          # Two labelled contact sheets for the overview.
          ffmpeg -v error \
            -i frames/shot01_title.jpg -i frames/shot02.jpg -i frames/shot06.jpg -i frames/shot10.jpg \
            -i frames/shot15.jpg -i frames/shot20_glass_a.jpg -i frames/shot24_fiddler.jpg -i frames/shot27_flamenco_a.jpg \
            -filter_complex "[0][1][2][3][4][5][6][7]xstack=inputs=8:layout=0_0|w0_0|w0+w1_0|w0+w1+w2_0|0_h0|w0_h0|w0+w1_h0|w0+w1+w2_h0,scale=1920:-1" \
            -frames:v 1 -q:v 3 frames/contact_1.jpg -y || echo "contact 1 skipped"
          ffmpeg -v error \
            -i frames/shot27_flamenco_b.jpg -i frames/shot29_stepdown.jpg -i frames/shot32_balinese.jpg -i frames/shot36_baker.jpg \
            -i frames/shot39_sheet.jpg -i frames/shot40_sheet.jpg -i frames/shot43_close.jpg -i frames/shot20_glass_b.jpg \
            -filter_complex "[0][1][2][3][4][5][6][7]xstack=inputs=8:layout=0_0|w0_0|w0+w1_0|w0+w1+w2_0|0_h0|w0_h0|w0+w1_h0|w0+w1+w2_h0,scale=1920:-1" \
            -frames:v 1 -q:v 3 frames/contact_2.jpg -y || echo "contact 2 skipped"
          ls -la frames
      - name: commit frames
        run: |
          set -e
          git config user.name "oniq-validation-bot"
          git config user.email "noreply@anthropic.com"
          BR="${{ github.event.inputs.out_branch }}"
          git checkout --orphan "$BR"
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github src remotion supabase public *.md *.json *.mjs *.ts *.cjs 2>/dev/null || true
          git add -f frames
          git commit -m "validation frames for job 5871421e (43-shot owner-actor acceptance)"
          git push -f origin "$BR"
