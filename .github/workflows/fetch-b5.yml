# One-off evidence bridge (val- pattern): fetches the batch-4 character
# masters from signed URLs the dev container cannot reach and parks them on
# THIS disposable branch for git pickup. Delete after collection.
name: Fetch b5 charlib masters
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "one line per file: <filename> <url>"
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and park
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          mkdir -p b5masters
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL "$url" -o "b5masters/$name"
          done <<< "$MANIFEST"
          ls -l b5masters && sha256sum b5masters/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b5masters
          git commit -m "b5 charlib masters ($(du -cb b5masters/* | tail -1 | cut -f1) bytes total)"
          git push origin HEAD
