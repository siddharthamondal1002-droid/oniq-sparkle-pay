# Hand a build artifact to somebody who cannot download it from Actions.
#
# WHY THIS EXISTS. Actions artifacts are served from
# productionresultssa11.blob.core.windows.net, and the dev container's egress
# proxy denies that host outright (403 to CONNECT — a policy denial, confirmed
# in the proxy's own recentRelayFailures, not a transient error). So an agent
# working in that container can trigger a build, watch it go green, and still
# have no way to put the .aab in front of the person who asked for it.
#
# The way through is a host the proxy DOES permit. `storage.googleapis.com` is
# one, and Lovable's get_file_upload_url hands out a presigned PUT there — the
# same route oniq-ship documents for moving a finished episode between
# machines. This workflow is the other half of it: the runner can reach both
# the artifact and that URL, so it relays one to the other.
#
# It re-uses an EXISTING run's artifact rather than rebuilding. A rebuild would
# take five minutes and, worse, would produce a different binary from the one
# already verified — so the thing delivered would not be the thing checked.
name: Relay artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id holding the artifact"
        required: true
      artifact:
        description: "Artifact name (e.g. oniq-release-aab)"
        required: true
        default: oniq-release-aab
      upload_url:
        description: "Presigned PUT URL to relay it to (optional)"
        required: false
        default: ""
      park_branch:
        description: "Disposable orphan branch to push the artifact to (optional)"
        required: false
        default: ""
      meta_user_id:
        description: "x-goog-meta-user_id — must match the presigned signature"
        required: false
        default: ""

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `actions: read` is the one that matters and is NOT in the default grant —
    # the first run failed with "Resource not accessible by integration"
    # because the token had Contents/Metadata/Packages read and nothing else.
    # Reading ANOTHER run's artifacts goes through the Actions API, so without
    # this the download 403s before any relay is attempted.
    permissions:
      actions: read
      contents: write
    steps:
      # Needed by the park step: it runs git, and download-artifact does not
      # clone anything, so without this there is no repository to commit into.
      - uses: actions/checkout@v5

      - name: Download the artifact from the other run
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay

      - name: Identify what we are about to send
        run: |
          find relay -type f -print0 | xargs -0 ls -l
          # The byte count is the identity check. oniq-ship's rule, learned on
          # three same-named mp4s of different lengths: match on the count,
          # never the filename.
          find relay -type f -exec sha256sum {} \;

      # THE ROUTE THAT ACTUALLY REACHES THE DEV CONTAINER.
      #
      # The presigned Google Storage URL above is signed for PUT only, so the
      # bytes land somewhere the uploader cannot read back — it delivers to
      # Lovable, not to whoever asked for the file. git is the one channel
      # proven to work in both directions from the container, so the artifact
      # is pushed to a DISPOSABLE ORPHAN BRANCH and fetched from there.
      #
      # Orphan, so it carries no history and shares no ancestor with main: the
      # binary can never be merged into the real tree by accident, and deleting
      # the branch reclaims it completely. Delete it once collected.
      - name: Park the artifact on a disposable branch
        if: inputs.park_branch != ''
        env:
          BRANCH: ${{ inputs.park_branch }}
        run: |
          F=$(find relay -type f | head -1)
          NAME=$(basename "$F")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name relay -exec rm -rf {} +
          mv "$F" "./$NAME"
          rm -rf relay
          git add "$NAME"
          git commit -q -m "artifact: $NAME ($(stat -c%s "$NAME") bytes)"
          git push -f origin "$BRANCH"
          echo "parked $NAME on $BRANCH"

      - name: Relay to the presigned URL
        if: inputs.upload_url != ''
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
        run: |
          F=$(find relay -type f | head -1)
          echo "relaying $F ($(stat -c%s "$F") bytes)"
          # The headers are not optional — the presigned signature covers them,
          # so a PUT without them is rejected as a signature mismatch rather
          # than as a missing header, which reads as a bad URL.
          code=$(curl -sS -X PUT \
            -H "content-type: application/octet-stream" \
            -H "x-goog-content-length-range: 0,262144000" \
            -H "x-goog-meta-user_id: ${{ inputs.meta_user_id }}" \
            --data-binary "@$F" \
            -o /tmp/put.out -w '%{http_code}' "$UPLOAD_URL")
          echo "PUT -> $code"
          head -c 400 /tmp/put.out || true
          [ "$code" = "200" ] || { echo "::error::relay failed"; exit 1; }
