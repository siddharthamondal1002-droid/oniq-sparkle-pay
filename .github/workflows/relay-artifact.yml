# Hand a build artifact to somebody who cannot download it from Actions.
#
# WHY THIS EXISTS. Actions artifacts are served from
# productionresultssa11.blob.core.windows.net, and the dev container's egress
# proxy denies that host outright (403 to CONNECT — a policy denial, confirmed
# in the proxy's own recentRelayFailures, not a transient error). So an agent
# working in that container can trigger a build, watch it go green, and still
# have no way to put the .aab in front of the person who asked for it.
#
# The way through is a host the proxy DOES permit. `storage.googleapis.com` is
# one, and Lovable's get_file_upload_url hands out a presigned PUT there — the
# same route oniq-ship documents for moving a finished episode between
# machines. This workflow is the other half of it: the runner can reach both
# the artifact and that URL, so it relays one to the other.
#
# It re-uses an EXISTING run's artifact rather than rebuilding. A rebuild would
# take five minutes and, worse, would produce a different binary from the one
# already verified — so the thing delivered would not be the thing checked.
name: Relay artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id holding the artifact"
        required: true
      artifact:
        description: "Artifact name (e.g. oniq-release-aab)"
        required: true
        default: oniq-release-aab
      upload_url:
        description: "Presigned PUT URL to relay it to"
        required: true
      meta_user_id:
        description: "x-goog-meta-user_id — must match the presigned signature"
        required: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the artifact from the other run
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relay

      - name: Identify what we are about to send
        run: |
          find relay -type f -print0 | xargs -0 ls -l
          # The byte count is the identity check. oniq-ship's rule, learned on
          # three same-named mp4s of different lengths: match on the count,
          # never the filename.
          find relay -type f -exec sha256sum {} \;

      - name: Relay to the presigned URL
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
        run: |
          F=$(find relay -type f | head -1)
          echo "relaying $F ($(stat -c%s "$F") bytes)"
          # The headers are not optional — the presigned signature covers them,
          # so a PUT without them is rejected as a signature mismatch rather
          # than as a missing header, which reads as a bad URL.
          code=$(curl -sS -X PUT \
            -H "content-type: application/octet-stream" \
            -H "x-goog-content-length-range: 0,262144000" \
            -H "x-goog-meta-user_id: ${{ inputs.meta_user_id }}" \
            --data-binary "@$F" \
            -o /tmp/put.out -w '%{http_code}' "$UPLOAD_URL")
          echo "PUT -> $code"
          head -c 400 /tmp/put.out || true
          [ "$code" = "200" ] || { echo "::error::relay failed"; exit 1; }
