name: ep3 clip transfer

# Rebuild the ep3 clip set from its CDN pointers and publish it as a release
# asset, so a machine that cannot reach the CDN can still get the bytes.
#
# WHY THIS EXISTS. The sixty conformed clips live as Lovable CDN assets with
# committed `.asset.json` pointers — see the header of
# remotion/scripts/ingest-ep3-clips.mjs for why they are not in git. The ONIQ
# dev container's proxy DENIES *.lovable.app and oniqhub.com, so
# `--fetch` cannot run there: it is the one machine with the renderer and the
# one machine that cannot see the clips. A runner has open egress and can.
#
# WHY A RELEASE ASSET AND NOT A BRANCH. Pushing 428 MB of mp4 onto an orphan
# branch works, but those objects stay in the repository after the branch is
# deleted, and every future clone pays for them. A release asset is outside git
# entirely: one tarball, deleted cleanly when it has served its purpose, and one
# download instead of sixty blobs. GitHub allows 2 GB per asset.
#
# THE TARBALL IS A CACHE, NOT A SOURCE. The pointers on main remain the record
# of what each clip is. Anything here can be rebuilt by running this again;
# nothing here should ever be the only copy of anything.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Which episode to transfer
        default: ep3
        required: false
      tag:
        description: Release tag to publish under (reused; the asset is replaced)
        default: ep3-clips-transfer
        required: false
      set:
        description: Which set to publish
        default: both
        required: false
        type: choice
        options: [both, conformed, raw]

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The ingest script resolves ffmpeg/ffprobe itself, but its search path is
      # the compositor's copy inside remotion/node_modules — which is not
      # installed here, and installing it would drag in the private npm mirror
      # named in remotion/bun.lock. The env overrides point it at the system
      # build instead. --fetch only ever PROBES; it does no encoding, so a stock
      # ffmpeg is more than enough.
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo "FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "FFPROBE=$(command -v ffprobe)" >> "$GITHUB_ENV"

      # CONFORMED CLIPS ARE REBUILT FROM THE RAWS, NOT FETCHED.
      #
      # They used to be fetched from their own CDN pointers, and that was wrong
      # in a way that took a failed run to notice: a conformed clip is DERIVED
      # from a raw generation plus the shot plan's frame count, and both of its
      # inputs change. Snapping the cuts onto the narration re-conformed 50 of
      # 60 clips and slowing the coda another 3, and none of those were
      # re-uploaded — so the pointers on main went on describing yesterday's
      # edit while the shot plan described today's. The frame-count guard caught
      # it (`ep3_s01b downloaded but is wrong: is 178 frames, not 191`), which is
      # the only reason it did not reach a render.
      #
      # Raws are INPUTS: immutable, never re-cut, always valid. Conforming is
      # deterministic from them and the committed shot plan. So deriving here is
      # always correct, where caching was correct only until someone re-cut.
      - name: Fetch raw generations
        if: inputs.set != 'raw'
        working-directory: remotion
        env:
          EPISODE: ${{ inputs.episode || 'ep3' }}
        run: bun scripts/ingest-ep3-clips.mjs --fetch-raw

      - name: Conform from raw
        if: inputs.set != 'raw'
        working-directory: remotion
        env:
          EPISODE: ${{ inputs.episode || 'ep3' }}
        run: bun scripts/ingest-ep3-clips.mjs --from "public/${EPISODE}/raw" --force

      - name: Check the set is complete
        if: inputs.set != 'raw'
        working-directory: remotion
        env:
          EPISODE: ${{ inputs.episode || 'ep3' }}
        run: |
          bun scripts/ingest-ep3-clips.mjs --check
          n=$(ls "public/$EPISODE/clips"/*.mp4 | wc -l)
          # Count against the RAW pointers, not conformed ones: conformed clips
          # are DERIVED on this runner (see the step above), and an episode
          # born after that lesson (ep4 onward) never commits conformed
          # pointers at all — the raws are the record.
          want=$(ls "public/$EPISODE/raw"/*.mp4.asset.json | wc -l)
          echo "$n clips, $want raw pointers"
          test "$n" -eq "$want"

      # Checksums travel with the bundle so the receiving box can prove it got
      # every byte, rather than trusting that a large download completed.
      #
      # SPLIT AT 1900 MB. A GitHub release asset is capped at 2 GB, and at ep3's
      # measured rates the raw set is ~105 MB per minute of finished video —
      # which puts a single-asset bundle over the cliff at about twenty minutes
      # of episode. Splitting unconditionally costs nothing for a small episode
      # (one part) and is the difference between working and not for a long one.
      # Rejoin with `cat <name>.part.* > <name>`.
      - name: Bundle conformed
        if: inputs.set != 'raw'
        env:
          EPISODE: ${{ inputs.episode || 'ep3' }}
        run: |
          cd "remotion/public/$EPISODE/clips"
          sha256sum ./*.mp4 > SHA256SUMS
          tar -czf "$RUNNER_TEMP/$EPISODE-clips.tar.gz" ./*.mp4 SHA256SUMS
          split -b 1900M -d -a 2 "$RUNNER_TEMP/$EPISODE-clips.tar.gz" "$RUNNER_TEMP/$EPISODE-clips.tar.gz.part."
          rm "$RUNNER_TEMP/$EPISODE-clips.tar.gz"
          ls -la "$RUNNER_TEMP"/$EPISODE-clips.tar.gz.part.*

      # The RAW generations: untrimmed, 1088 wide, 24fps, audio still on them.
      # Re-cutting the episode needs frames a conformed clip does not have —
      # it is trimmed to exactly its allocation — so these are what make a
      # re-cut a re-conform rather than a regeneration.
      #
      # No gzip. This is h264, which does not compress, and squeezing ~1 GB of
      # it costs a minute of runner time to save nothing.
      # Already fetched above when set != 'raw'; --fetch-raw is idempotent and
      # skips anything already on disk at the right size.
      - name: Fetch raw generations
        if: inputs.set == 'raw'
        working-directory: remotion
        env:
          EPISODE: ${{ inputs.episode || 'ep3' }}
        run: bun scripts/ingest-ep3-clips.mjs --fetch-raw

      - name: Bundle raw
        if: inputs.set != 'conformed'
        env:
          EPISODE: ${{ inputs.episode || 'ep3' }}
        run: |
          cd "remotion/public/$EPISODE/raw"
          sha256sum ./*.mp4 > SHA256SUMS
          tar -cf "$RUNNER_TEMP/$EPISODE-raw.tar" ./*.mp4 SHA256SUMS
          split -b 1900M -d -a 2 "$RUNNER_TEMP/$EPISODE-raw.tar" "$RUNNER_TEMP/$EPISODE-raw.tar.part."
          rm "$RUNNER_TEMP/$EPISODE-raw.tar"
          ls -la "$RUNNER_TEMP"/$EPISODE-raw.tar.part.*

      # `--clobber` because the tag is reused: re-running this replaces the
      # asset rather than failing on a name collision. The release is a
      # prerelease so it cannot be mistaken for a shipped version of the app.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || format('{0}-clips-transfer', inputs.episode || 'ep3') }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "${{ inputs.episode || 'ep3' }} clip transfer" \
              --notes "Clips rebuilt from CDN pointers. Split at 1900 MB — rejoin with: cat NAME.part.* > NAME. A cache, not a source; delete when done." \
              --prerelease
          # An `if`, not `[ -f ] && ...`: with `set -e` the && form leaves the
          # loop with a non-zero status when the LAST file is absent, failing a
          # step that did exactly what was asked of it.
          shopt -s nullglob
          parts=("$RUNNER_TEMP"/*.part.*)
          if [ ${#parts[@]} -eq 0 ]; then echo "nothing bundled"; exit 1; fi
          for f in "${parts[@]}"; do gh release upload "$TAG" "$f" --clobber; done
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
