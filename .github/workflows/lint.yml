name: lint

# The blocking lint gate. Runs the exact same command as the pre-commit hook
# and the Claude Code PostToolUse hook: `npm run lint:ci`.
#
# Why this workflow exists: on 2026-08-04 three react-hooks/rules-of-hooks
# violations reached production. tsc was clean, 275 tests were green, and a
# signed-in walk of the live app found nothing — the app threw to the root
# error boundary only once a personalisation suggestion appeared. ESLint would
# have caught all three, but the run reported 6,630 errors (91% of them
# Prettier formatting) so nobody read it. Formatting is now Prettier's job and
# this gate reports only things that break the app.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22, matching android-build.yml and story-worker.yml: @capacitor/cli
          # and @supabase/* declare node >=22, so Node 20 made every `npm ci`
          # log a wall of EBADENGINE warnings and run the gate on an engine the
          # dependencies do not support.
          node-version: "22"
          cache: npm

      - run: npm ci

      # Suppressions in eslint-suppressions.ci.json are applied automatically:
      # the pre-existing tail is frozen, only NEW violations fail.
      - name: Blocking lint gate
        run: npm run lint:ci

      # Every declared dependency must resolve to a real, registry-published
      # package whose own name matches. No lint rule catches a hallucinated or
      # typosquatted package name, and this codebase is agent-written.
      - name: Dependencies exist
        run: npm run check:deps

      # Advisory, not blocking. 199 files predate Prettier being enforced;
      # formatting them would be one commit rewriting nearly the whole repo.
      # Run `npm run format:check:changed` locally before pushing.
      - name: Formatting (advisory)
        run: npm run format:check:changed
        continue-on-error: true

      - name: Types
        run: npx tsc --noEmit

      # One test needs to encode a real mp4: the story dry-run's clip fixture,
      # which has now been broken twice in ways that produced a finished film
      # and a ledger of successful calls (an answer keyed `video` where the
      # worker reads `data`, and an mp4 built with a filter the renderer's
      # ffmpeg does not carry). It skips without a binary, so install one.
      #
      # This runner has no ffmpeg, and `npm ci` here installs the ROOT
      # package only — remotion's own node_modules, where the compositor build
      # lives, is never created. So there is nothing for the test to find.
      #
      # WHAT THIS DOES AND DOES NOT BUY. It makes the test assert that the
      # fixture returns a playable mp4 under the key the worker reads. It does
      # NOT check the filter surface: this is a FULL ffmpeg, so a clip builder
      # that reached for lavfi again would encode happily here and still fail
      # on the renderer's cut-down build. That case is covered by a separate
      # static assertion which needs no binary and runs everywhere.
      - name: ffmpeg (for the story dry-run clip fixture)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests
        run: npm test
