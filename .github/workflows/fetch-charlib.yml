# One-off evidence bridge (val- pattern): the runner can reach hosts the dev
# container cannot. Fetches the generated character masters from public URLs
# and parks them on THIS disposable branch for git pickup. Delete the branch
# once collected.
name: Fetch charlib masters
on:
  workflow_dispatch:
    inputs:
      url1: { description: "URL for basma.png", required: true }
      url2: { description: "URL for rashid.png", required: true }
      url3: { description: "URL for urchin.png", required: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and park
        env:
          U1: ${{ inputs.url1 }}
          U2: ${{ inputs.url2 }}
          U3: ${{ inputs.url3 }}
        run: |
          mkdir -p charlib
          curl -fsSL "$U1" -o charlib/basma.png
          curl -fsSL "$U2" -o charlib/rashid.png
          curl -fsSL "$U3" -o charlib/urchin.png
          ls -l charlib && sha256sum charlib/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charlib
          git commit -m "charlib masters ($(du -cb charlib/*.png | tail -1 | cut -f1) bytes total)"
          git push origin HEAD
