name: story worker

# Render one queued Story into a finished mp4.
#
# WHY A RUNNER AND NOT AN EDGE FUNCTION. The picture is Remotion driving
# headless Chromium and encoding with ffmpeg. That cannot run in a Supabase edge
# function at all — the earlier plan of assembling with WASM ffmpeg only worked
# while the clips came back pre-encoded from a video model. Once ONIQ started
# rendering its own frames, the render moved to where a browser exists.
#
# ONE JOB PER RUN, and the worker enforces it too. The guard order this project
# uses ends with "then the billable call", and a worker that drains a queue in a
# loop turns one bad plan into a bill. The schedule below runs it again; nothing
# loops.
#
# CONCURRENCY IS PER JOB, and the double-pay guard lives in the CLAIM. The
# group used to be one global gate, on the theory that two runners claiming
# the same `queued` row would both generate it and both pay for it — but that
# guarantee is story-callback's: the claim moves queued->generating atomically
# and answers the second claimant with a 409, which claimJob() already treats
# as "nothing to do". Globally keyed, the gate was the scaling ceiling
# instead: ONE Story rendered at a time while everyone else's queued into the
# 30-minute stale sweep and died there — at five simultaneous users, jobs
# were being killed for waiting. Keyed on the job id, N Stories render in
# parallel and the same-job race stays impossible. `cancel-in-progress:
# false` still matters: cancelling a run mid-render would leave a job stuck
# at `generating` with its stills already bought.
#
# TWO WAYS IN, and only one of them is the product. A repository_dispatch from
# story-dispatch carries a job id and a per-job token, and the runner needs no
# Supabase credential at all. workflow_dispatch is for operating the thing by
# hand, and only works if somebody has chosen to put a service key here.
#
# Render cost, measured: about 4.5 minutes per minute of finished video
# (0.221x realtime on this container's two usable cores; 0.305x on four).
#
# IT IS SAFE TO RUN WITH THE FEATURE OFF. `story_config.enabled` gates whether a
# user can create a job at all. With it false there is nothing queued, the
# worker prints "nothing queued" and exits 0. That is the intended state until
# a real per-Story cost has been measured.

on:
  # Supabase reaches OUT to us. story-dispatch finds a queued job and sends
  # this event with the job id and a capability token scoped to that one job
  # for an hour. That is the whole reason this repository holds no Supabase
  # key: the runner is handed a receipt, not the keys to the database.
  repository_dispatch:
    types: [story-job]

  # THERE IS DELIBERATELY NO SCHEDULE HERE. A cron on this side would be the
  # polling design again: it can only work if GitHub holds a Supabase key, and
  # without one it would paint a red X on the repository every ten minutes for
  # a queue it cannot read. The heartbeat lives in Supabase instead — pg_cron
  # calls story-dispatch, which reaches out with a job and a token.
  workflow_dispatch:
    inputs:
      voice:
        description: Gemini TTS voice for the narrator
        default: Charon
        required: false
      actor_refs:
        # OWNER-ACTOR conditioning (STORY_ACTOR_REFS), feature-gated. Default
        # off so a manual run behaves exactly like production unless explicitly
        # asked for. Set to "on" only for the deliberate owner-actor regression;
        # repository_dispatch (the product path) never sets this, so real user
        # renders are unaffected.
        description: Enable owner-actor conditioning (STORY_ACTOR_REFS)
        default: "off"
        required: false

concurrency:
  # Manual workflow_dispatch runs have no job id yet (the runner claims one
  # itself), so they key on the run id — each its own group, the atomic claim
  # still guarding them.
  group: story-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    # A ten-minute Story is ~33 minutes of render plus generation and upload,
    # and the film-look grade pass adds up to ~2.5x realtime on this runner's
    # two cores (~25 minutes at maximum length). Movie grade adds a Veo
    # generation per shot — sequential, minutes each, ~17 shots at the 120s
    # movie cap — which is why this is 150 rather than the 90 the classic
    # arithmetic needed. Past this the job is wedged rather than slow. The
    # lock this timeout protects is per-job, so a wedged runner delays only
    # its own Story.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # 22 strips TypeScript natively, which is how the worker imports
          # src/lib/shotGrammar.ts directly instead of keeping a second copy of
          # the shot grammar in JavaScript to drift from the first.
          node-version: "22"

      # The worker resolves ffmpeg/ffprobe through findFfmpeg.mjs, whose default
      # is the compositor's cut-down build inside remotion/node_modules. It has
      # no rawvideo muxer and is missing several filters. The system build is
      # complete, so point at it explicitly rather than relying on whichever
      # copy the search happens to find first.
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo "FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "FFPROBE=$(command -v ffprobe)" >> "$GITHUB_ENV"

      # npm, not bun. remotion/bun.lock names Lovable's private npm mirror,
      # which 403s from anywhere else; npm ignores that lock and resolves
      # against the public registry.
      - name: install remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund

      # Remotion needs a real Chromium. Its own installer is the supported path
      # and findChromium.mjs knows where it lands.
      - name: chromium
        working-directory: remotion
        run: |
          # XDG_RUNTIME_DIR is set on the render step below and Chrome writes
          # its singleton and crashpad state there. Pointing it at a directory
          # that does not exist is worse than leaving it unset, so it is made
          # here rather than assumed.
          mkdir -p /tmp/oniq-runtime && chmod 700 /tmp/oniq-runtime
          npx remotion browser ensure

      # REDACT THE PER-JOB TOKEN FROM THE LOG.
      #
      # STORY_JOB_TOKEN arrives in the repository_dispatch payload, not from
      # `secrets`, so GitHub never auto-masks it — and GitHub echoes every
      # `run:` step's resolved `env:` block in the collapsed group header. The
      # net effect was that the render step below printed the token in full
      # plaintext (right next to a correctly-masked `SUPABASE_URL: ***`).
      #
      # Registering the value with `::add-mask::` here — BEFORE the render step
      # runs — makes GitHub redact it to `***` in every later line, including
      # that env header. The token is read from the event file into a shell
      # variable, never interpolated via `${{ }}` and never echoed: the `run:`
      # script GitHub prints is the literal text below (with `$tok`, not its
      # value), and jq's output is captured, not written to stdout. This changes
      # only what the log renders — the render step still receives the real
      # token in its environment, so the auth path is untouched. The token is a
      # one-hour single-job capability, but a printed credential is a printed
      # credential.
      - name: redact the job token from the log
        run: |
          tok="$(jq -r '.client_payload.token // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "$tok" ]; then echo "::add-mask::$tok"; fi

      - name: render one job
        working-directory: remotion
        env:
          # CHROME STOPS LOOKING FOR A MESSAGE BUS THAT IS NOT THERE.
          #
          # A GitHub runner has no D-Bus session, so every launch logs
          #   Failed to connect to the bus: Could not parse server address:
          #   Unknown address type
          # twice before it gets anywhere. Usually that is noise — but it is
          # what Chrome was doing in the 25 seconds it spent failing to print
          # its WebSocket endpoint on 2026-08-13, which cost a fully rendered
          # film at the last step. Pointing the address at /dev/null makes the
          # attempt fail instantly instead of waiting on a socket nobody is
          # listening to, and clears the log so a REAL launch error is legible
          # next to it.
          DBUS_SESSION_BUS_ADDRESS: /dev/null
          # Chrome writes its singleton and crashpad state here. Unset, it
          # falls back to guesses under /tmp that differ between runner images.
          XDG_RUNTIME_DIR: /tmp/oniq-runtime
          # The project URL is not a secret — it is in the shipped client
          # bundle. Keeping it as a variable rather than a secret means a
          # dispatch run needs NOTHING configured here beyond this line, which
          # is the point of Route B: no Supabase key ever reaches GitHub.
          # The dispatch payload wins. A repository secret holding a second
          # copy of the project address is a copy that can go stale, and it
          # did: every dispatch died on a gateway 404 because this secret named
          # a different project. Supabase sends its own address now; the secret
          # is only a fallback for the manual workflow_dispatch path.
          SUPABASE_URL: ${{ github.event.client_payload.supabase_url || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          # Only the polling path uses this, and only if someone chooses to set
          # it. Absent — the expected state — the cron fires, the worker finds
          # no token and no key, and exits with a message naming both.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORY_VOICE: ${{ inputs.voice || 'Charon' }}
          # THE PRODUCTION VOICE IS ONIQ'S OWN (owner directive 2026-08-27,
          # fully in-house generation): piper on this runner, sha256-pinned
          # and MIT, speaking every narration and every character line. It
          # was already here as the quota-free switch and the dry-bucket
          # fallback; 'only' makes it the path itself, so no cloud TTS
          # provider is required for a film to finish. The engine never
          # flips to cloud from here — 'only' is checked before the first
          # line is spoken, not after a failure.
          STORY_LOCAL_TTS: only
          # OWNER-ACTOR conditioning, opt-in per JOB — never globally on.
          #   repository_dispatch: on ONLY when story-dispatch marks THIS job's
          #     client_payload.actor_refs true (a story_jobs.actor_refs flag);
          #     every ordinary production job sends false/absent -> 'off', so
          #     real user renders are byte-for-byte unchanged.
          #   workflow_dispatch: the manual actor_refs input.
          #   default: 'off'. The worker's own default is 'off' too, so an unset
          #     value can never enable it.
          STORY_ACTOR_REFS: ${{ (github.event.client_payload.actor_refs && 'on') || inputs.actor_refs || 'off' }}
          # PER-JOB clip-stage mode, payload-only (owner-authorized Veo
          # `select` validation, 2026-08-22). story-dispatch sends
          # client_payload.story_movie ONLY when the job row's motion_mode
          # column — service-role-writable only — is 'select'; every ordinary
          # production job sends nothing, this resolves to '', and the
          # worker's clip stage stays off exactly as before. There is
          # deliberately no manual input for this: the every-shot 'on'
          # experiment must never become reachable from a dispatch form.
          STORY_MOVIE: ${{ github.event.client_payload.story_movie || '' }}
          # Present only on a repository_dispatch. The token IS the credential:
          # it names one job, expires in an hour, and story-callback checks it
          # before touching the database on this runner's behalf.
          STORY_JOB_ID: ${{ github.event.client_payload.job_id }}
          STORY_JOB_TOKEN: ${{ github.event.client_payload.token }}
          # Two encoders' worth of parallelism on a two-core runner. The
          # bottleneck measured as one ffmpeg encoder rather than the browser,
          # so more than this buys nothing.
          CONCURRENCY: "2"
        run: node scripts/story-worker.mjs

      # Only on failure, and only the log. A Story's frames are the user's and
      # must not sit in an artifact after the job that made them failed — the
      # whole lifecycle exists so that every path ends in `purged`.
      - name: failure log
        if: failure()
        run: echo "story worker failed — see the step log above"
