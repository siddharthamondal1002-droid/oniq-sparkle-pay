# Build a signed Android App Bundle (.aab) for ONIQ.
#
# Strategy: thin Capacitor wrapper — the AAB just points at https://oniqhub.com,
# so shipped builds always run the current production site. No local web assets
# ship with the APK; the dist/ folder is a stub (.gitkeep) purely to satisfy
# `npx cap sync`.
#
# Signing: the release keystore lives at android/keystore/oniq-release.jks in
# this (private) repo and is unlocked by the KEYSTORE_PASSWORD repo secret —
# the only secret required. If the keystore file is missing, the workflow
# generates one protected by that secret and commits it back to the branch.
# KEY_ALIAS / KEY_PASSWORD / ANDROID_KEYSTORE_BASE64 secrets are optional
# legacy inputs; the "Resolve signing credentials" step verifies everything
# with keytool before building.

name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write lets the workflow commit the generated release keystore
    # back to the branch so it persists across runs.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # webDir must exist for `cap sync`; the stub dist/.gitkeep is enough
      # because server.url points at live production.
      - name: Ensure webDir stub exists
        run: mkdir -p dist && touch dist/.gitkeep

      - name: Remove stray capacitor.config.ts (json is source of truth)
        run: rm -f capacitor.config.ts

      - name: Capacitor sync android
        run: npx cap sync android

      # -----------------------------------------------------------------
      # Keystore, in priority order:
      #   1. android/keystore/oniq-release.jks committed in the repo
      #   2. ANDROID_KEYSTORE_BASE64 secret (legacy path, if it decodes to
      #      a real keystore)
      #   3. Generate a new one protected by the KEYSTORE_PASSWORD secret
      #      and COMMIT it to this branch so every future run reuses it.
      # Only the KEYSTORE_PASSWORD secret is required.
      # -----------------------------------------------------------------
      - name: Prepare keystore
        id: keystore_prep
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS=android/app/oniq.keystore
          REPO_KS=android/keystore/oniq-release.jks
          is_keystore() {
            case "$(xxd -p -l4 "$1" 2>/dev/null)" in
              feedfeed|3082*) return 0 ;;
              *) return 1 ;;
            esac
          }
          if [ -f "$REPO_KS" ]; then
            cp "$REPO_KS" "$KS"
            echo "Using release keystore committed in the repo."
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] \
            && printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n"' | base64 -d > "$KS" 2>/dev/null \
            && is_keystore "$KS"; then
            echo "Using keystore from ANDROID_KEYSTORE_BASE64 secret; committing it to the repo for future runs."
            mkdir -p android/keystore
            cp "$KS" "$REPO_KS"
            echo "commit_keystore=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "No usable keystore found — generating one protected by the KEYSTORE_PASSWORD secret."
            rm -f "$KS"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias oniq \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=ONIQ, OU=Mobile, O=OniqHub, L=Kolkata, ST=WB, C=IN"
            mkdir -p android/keystore
            cp "$KS" "$REPO_KS"
            echo "commit_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No keystore available and the KEYSTORE_PASSWORD secret is not set. Add KEYSTORE_PASSWORD and re-run."
            exit 1
          fi

      - name: Commit keystore to repo (one-time)
        if: steps.keystore_prep.outputs.commit_keystore == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/keystore/oniq-release.jks
          git commit -m "Persist Android release keystore (unlocked only by the KEYSTORE_PASSWORD secret)"
          git push origin HEAD:"$GITHUB_REF_NAME"

      # Extra safety net: the keystore is also downloadable from this run.
      - name: Upload keystore backup artifact
        if: steps.keystore_prep.outputs.commit_keystore == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keystore-backup
          path: android/keystore/oniq-release.jks
          retention-days: 90

      # Verify the secrets actually unlock the keystore BEFORE the 3-minute
      # Gradle build, and self-heal the common mistakes: wrong/empty KEY_ALIAS
      # (fall back to the store's real private-key alias) and wrong/empty
      # KEY_PASSWORD (the generator always sets it equal to KEYSTORE_PASSWORD).
      - name: Resolve signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS=android/app/oniq.keystore

          # --- Safe diagnostics (never prints secret values) -------------
          SIZE=$(stat -c%s "$KS")
          MAGIC=$(xxd -p -l4 "$KS" 2>/dev/null || echo "????")
          case "$MAGIC" in
            feedfeed) KIND="JKS keystore" ;;
            3082*)    KIND="PKCS12 keystore" ;;
            *)        KIND="NOT a keystore" ;;
          esac
          echo "Decoded keystore: $SIZE bytes, magic=$MAGIC ($KIND)"
          echo "Secret lengths: KEYSTORE_PASSWORD=${#KEYSTORE_PASSWORD} KEY_ALIAS=${#KEY_ALIAS} KEY_PASSWORD=${#KEY_PASSWORD} (generated password is 24 chars)"
          if [ "$KIND" = "NOT a keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decodes to something that is not a keystore (magic=$MAGIC). The wrong content was pasted — copy the contents of keystore.jks.base64 (the .base64 TEXT file, not the .jks binary) from the newest keystore artifact."
            exit 1
          fi

          # Users sometimes paste the whole 'KEYSTORE_PASSWORD=xxx' line, add
          # whitespace, or swap the two password fields — try sane variants.
          strip() { printf '%s' "$1" | tr -d ' \t\r\n' | sed 's/^KEYSTORE_PASSWORD=//;s/^KEY_PASSWORD=//'; }
          STOREPASS=""
          for C in "$KEYSTORE_PASSWORD" "$(strip "$KEYSTORE_PASSWORD")" "$KEY_PASSWORD" "$(strip "$KEY_PASSWORD")"; do
            [ -z "$C" ] && continue
            if keytool -list -keystore "$KS" -storepass "$C" >/dev/null 2>&1; then
              STOREPASS="$C"
              break
            fi
          done
          if [ -z "$STOREPASS" ]; then
            echo "::error::No provided password opens this keystore. The keystore file and KEYSTORE_PASSWORD do not belong together. Fix: open credentials.txt from the SAME keystore artifact your ANDROID_KEYSTORE_BASE64 came from, and set KEYSTORE_PASSWORD to only the characters AFTER 'KEYSTORE_PASSWORD=' (24 characters, no spaces)."
            exit 1
          fi
          [ "$STOREPASS" != "$KEYSTORE_PASSWORD" ] && echo "::warning::KEYSTORE_PASSWORD as pasted did not work; a cleaned/alternate variant opened the keystore and will be used."

          ALIAS="${KEY_ALIAS:-oniq}"
          if ! keytool -list -keystore "$KS" -storepass "$STOREPASS" -alias "$ALIAS" >/dev/null 2>&1; then
            ALIAS=$(keytool -list -keystore "$KS" -storepass "$STOREPASS" 2>/dev/null | awk -F, '/PrivateKeyEntry/{print $1; exit}')
            if [ -z "$ALIAS" ]; then
              echo "::error::No private key entry found in the keystore."
              exit 1
            fi
            echo "::warning::KEY_ALIAS secret did not match any key; using the alias found in the keystore instead."
          fi

          RESOLVED=""
          for C in "$KEY_PASSWORD" "$(strip "$KEY_PASSWORD")" "$STOREPASS"; do
            [ -z "$C" ] && continue
            if keytool -certreq -keystore "$KS" -storepass "$STOREPASS" -alias "$ALIAS" -keypass "$C" -file /dev/null >/dev/null 2>&1; then
              RESOLVED="$C"
              break
            fi
          done
          if [ -z "$RESOLVED" ]; then
            echo "::error::No provided password unlocks the signing key '$ALIAS'."
            exit 1
          fi

          {
            echo "ONIQ_STORE_PASSWORD=$STOREPASS"
            echo "ONIQ_KEY_ALIAS=$ALIAS"
            echo "ONIQ_KEY_PASSWORD=$RESOLVED"
          } >> "$GITHUB_ENV"
          echo "Signing credentials verified OK."

      # The upload certificate is PUBLIC key material — safe to print and
      # publish as an artifact. Play's "request upload key reset" form wants
      # exactly this PEM; the SHA1 line lets us match Play's fingerprints.
      - name: Export upload certificate (PEM)
        run: |
          keytool -exportcert -rfc \
            -keystore android/app/oniq.keystore \
            -alias "$ONIQ_KEY_ALIAS" \
            -storepass "$ONIQ_STORE_PASSWORD" \
            -file upload_certificate.pem
          echo "Current signing certificate fingerprints:"
          keytool -list -v -keystore android/app/oniq.keystore \
            -alias "$ONIQ_KEY_ALIAS" -storepass "$ONIQ_STORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:" || true

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v7
        with:
          name: upload-certificate-pem
          path: upload_certificate.pem
          retention-days: 90

      - name: Build signed AAB
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE: ${{ github.workspace }}/android/app/oniq.keystore
          # Verified values from the "Resolve signing credentials" step.
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE_PASSWORD: ${{ env.ONIQ_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ONIQ_KEY_ALIAS: ${{ env.ONIQ_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ONIQ_KEY_PASSWORD: ${{ env.ONIQ_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      # R8 DID NOT EAT THE PLUGINS — checked, not assumed.
      #
      # Everything Capacitor does across the JS/native boundary is reflective:
      # plugins are found by annotation, methods invoked by name from
      # JavaScript. R8 sees no call site for any of it, so without the keep
      # rules in proguard-rules.pro it would delete the lot — and the build
      # would still succeed. The failure would surface as a dead button on a
      # user's phone after an auto-update, which is the worst place to find it.
      #
      # So this reads R8's own usage.txt (the list of what it REMOVED) and
      # fails the build if any of this app's native classes are on it. Keep
      # rules that are merely present prove nothing; this is the evidence.
      - name: Verify R8 kept the Capacitor plugin surface
        working-directory: android
        run: |
          U=$(find app/build/outputs/mapping/release -name usage.txt | head -1)
          if [ -z "$U" ]; then
            echo "::error::no R8 usage report — is minifyEnabled still on?"
            exit 1
          fi
          echo "usage report: $U ($(wc -l < "$U") lines removed)"

          fail=0
          for c in SpeakerRouterPlugin ContactsBridgePlugin CallSettingsPlugin \
                   MediaSaverPlugin SystemBarsPlugin NotificationTrayPlugin \
                   OniqMessagingService MainActivity; do
            # A bare class line in usage.txt means the whole class went. A
            # nested "    method" line under it means members went.
            if grep -qE "^com\.oniqhub\.app\.$c$" "$U"; then
              echo "::error::R8 removed the class com.oniqhub.app.$c"
              fail=1
            fi
          done

          # And prove the classes are actually present in the mapping, rather
          # than passing because R8 never ran over them at all.
          M=$(find app/build/outputs/mapping/release -name mapping.txt | head -1)
          for c in SpeakerRouterPlugin NotificationTrayPlugin OniqMessagingService; do
            grep -q "com.oniqhub.app.$c" "$M" || {
              echo "::error::com.oniqhub.app.$c is absent from mapping.txt"; fail=1; }
          done

          echo "--- anything of ours R8 touched ---"
          grep -n "com\.oniqhub\.app" "$U" | head -30 || echo "  (nothing removed from com.oniqhub.app)"
          exit $fail

      - name: Upload R8 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-reports
          path: android/app/build/outputs/mapping/release/
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: oniq-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # THE SYMBOLS ARE ACTUALLY IN THE BUNDLE — opened and checked.
      #
      # Play warned on version code 12 that the bundle carries native code
      # with no debug symbols. build.gradle now sets debugSymbolLevel FULL,
      # but that setting is a request, not a guarantee: AGP can only extract
      # symbols a dependency's .so still has, and it merely WARNS when one has
      # already been stripped. A build where every native library came in
      # stripped would succeed, ship no symbols, and draw the identical Play
      # warning on the next upload — after the upload, which is the expensive
      # place to learn it.
      #
      # So this opens the finished .aab and compares two counts. Deliberately
      # placed AFTER the upload step: if the check fails I want the bundle
      # downloadable so the offending libraries can be identified, not thrown
      # away with the failed job.
      - name: Verify the bundle carries native debug symbols
        working-directory: android
        run: |
          Z=app/build/outputs/bundle/release/app-release.aab

          echo "--- native libraries in the bundle ---"
          unzip -l "$Z" | awk '$4 ~ /\.so$/ { printf "  %10s  %s\n", $1, $4 }' | sort -k2 || true
          echo "--- debug symbols in BUNDLE-METADATA ---"
          unzip -l "$Z" \
            | awk '$4 ~ /^BUNDLE-METADATA\/com\.android\.tools\.build\.debugsymbols\// { printf "  %10s  %s\n", $1, $4 }' \
            || true

          SO=$(unzip -l "$Z" | awk '$4 ~ /\.so$/' | wc -l)
          SYM=$(unzip -l "$Z" | awk '$4 ~ /^BUNDLE-METADATA\/com\.android\.tools\.build\.debugsymbols\/.+/' | wc -l)
          echo "$SO native libraries, $SYM symbol files"

          if [ "$SO" -eq 0 ]; then
            echo "No native libraries in this bundle — nothing for Play to ask symbols for."
            exit 0
          fi
          if [ "$SYM" -eq 0 ]; then
            echo "::error::The bundle has $SO native libraries and no debug symbols. debugSymbolLevel is set, so the libraries reached AGP already stripped — check the build log for 'Unable to extract native debug metadata'."
            exit 1
          fi
          echo "Native debug symbols are present; Play's warning on version code 12 is answered."

      - name: Build signed APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE: ${{ github.workspace }}/android/app/oniq.keystore
          # Verified values from the "Resolve signing credentials" step.
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE_PASSWORD: ${{ env.ONIQ_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ONIQ_KEY_ALIAS: ${{ env.ONIQ_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ONIQ_KEY_PASSWORD: ${{ env.ONIQ_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: oniq-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
