# Build a signed Android App Bundle (.aab) for ONIQ.
#
# Strategy: thin Capacitor wrapper — the AAB just points at https://oniqhub.com,
# so shipped builds always run the current production site. No local web assets
# ship with the APK; the dist/ folder is a stub (.gitkeep) purely to satisfy
# `npx cap sync`.
#
# First run (no keystore secrets set yet):
#   1. Trigger the workflow.
#   2. Signing step FAILS on purpose and uploads an artifact called
#      "keystore-SAVE-THIS-ONCE" containing keystore.jks + credentials.txt.
#   3. Download the artifact, add these 4 repo secrets under
#      Settings → Secrets and variables → Actions:
#        - ANDROID_KEYSTORE_BASE64  (base64 of keystore.jks — one line)
#        - KEYSTORE_PASSWORD
#        - KEY_ALIAS                 (use: oniq)
#        - KEY_PASSWORD
#   4. Re-run the workflow. The AAB uploads as artifact "oniq-release-aab".

name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # webDir must exist for `cap sync`; the stub dist/.gitkeep is enough
      # because server.url points at live production.
      - name: Ensure webDir stub exists
        run: mkdir -p dist && touch dist/.gitkeep

      - name: Remove stray capacitor.config.ts (json is source of truth)
        run: rm -f capacitor.config.ts

      - name: Capacitor sync android
        run: npx cap sync android

      # -----------------------------------------------------------------
      # Keystore: generate-on-first-run OR reuse from repo secrets
      # -----------------------------------------------------------------
      - name: Check for keystore secret
        id: keystore_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate keystore (first run only)
        if: steps.keystore_check.outputs.has_keystore == 'false'
        run: |
          mkdir -p keystore-out
          GEN_PASS="$(openssl rand -base64 24 | tr -d '=+/' | cut -c1-24)"
          keytool -genkeypair -v \
            -keystore keystore-out/keystore.jks \
            -alias oniq \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$GEN_PASS" -keypass "$GEN_PASS" \
            -dname "CN=ONIQ, OU=Mobile, O=OniqHub, L=Kolkata, ST=WB, C=IN"
          {
            echo "SAVE THIS FILE — you cannot recover it later."
            echo ""
            echo "KEY_ALIAS=oniq"
            echo "KEYSTORE_PASSWORD=$GEN_PASS"
            echo "KEY_PASSWORD=$GEN_PASS"
            echo ""
            echo "Also add ANDROID_KEYSTORE_BASE64 = the base64 of keystore.jks (single line)."
            echo "You can produce it locally with:  base64 -w0 keystore.jks"
          } > keystore-out/credentials.txt
          base64 -w0 keystore-out/keystore.jks > keystore-out/keystore.jks.base64

      - name: Upload keystore artifact (first run only)
        if: steps.keystore_check.outputs.has_keystore == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: keystore-SAVE-THIS-ONCE
          path: keystore-out/
          retention-days: 30

      - name: Stop with instructions (first run only)
        if: steps.keystore_check.outputs.has_keystore == 'false'
        run: |
          echo "::error::Keystore was generated. Download the 'keystore-SAVE-THIS-ONCE' artifact, then add ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD as repo secrets and re-run this workflow."
          exit 1

      # -----------------------------------------------------------------
      # Signed release build (only when secrets are present)
      # -----------------------------------------------------------------
      - name: Decode keystore
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          # Tolerate line-wrapped / whitespace-padded pastes of the base64 secret.
          if ! printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d ' \t\r\n"' | base64 -d > android/app/oniq.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-copy the ENTIRE contents of keystore.jks.base64 from the keystore artifact into the secret (it may have been truncated or altered when pasting)."
            exit 1
          fi

      # Verify the secrets actually unlock the keystore BEFORE the 3-minute
      # Gradle build, and self-heal the common mistakes: wrong/empty KEY_ALIAS
      # (fall back to the store's real private-key alias) and wrong/empty
      # KEY_PASSWORD (the generator always sets it equal to KEYSTORE_PASSWORD).
      - name: Resolve signing credentials
        if: steps.keystore_check.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS=android/app/oniq.keystore
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore. Re-copy it from credentials.txt (no spaces/newlines), and make sure ANDROID_KEYSTORE_BASE64 and KEYSTORE_PASSWORD come from the SAME keystore artifact."
            exit 1
          fi
          ALIAS="${KEY_ALIAS:-oniq}"
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
            ALIAS=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{print $1; exit}')
            if [ -z "$ALIAS" ]; then
              echo "::error::No private key entry found in the keystore."
              exit 1
            fi
            echo "::warning::KEY_ALIAS secret did not match any key; using the alias found in the keystore instead."
          fi
          RESOLVED=""
          for CANDIDATE in "$KEY_PASSWORD" "$KEYSTORE_PASSWORD"; do
            [ -z "$CANDIDATE" ] && continue
            if keytool -certreq -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" -keypass "$CANDIDATE" -file /dev/null >/dev/null 2>&1; then
              RESOLVED="$CANDIDATE"
              break
            fi
          done
          if [ -z "$RESOLVED" ]; then
            echo "::error::Neither KEY_PASSWORD nor KEYSTORE_PASSWORD unlocks the signing key. Set the KEY_PASSWORD repo secret to the KEY_PASSWORD value from credentials.txt."
            exit 1
          fi
          if [ "$RESOLVED" != "$KEY_PASSWORD" ]; then
            echo "::warning::KEY_PASSWORD secret did not unlock the key; using KEYSTORE_PASSWORD (generator sets them equal)."
          fi
          {
            echo "ONIQ_KEY_ALIAS=$ALIAS"
            echo "ONIQ_KEY_PASSWORD=$RESOLVED"
          } >> "$GITHUB_ENV"

      - name: Build signed AAB
        if: steps.keystore_check.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE: ${{ github.workspace }}/android/app/oniq.keystore
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Verified values from the "Resolve signing credentials" step.
          ORG_GRADLE_PROJECT_ONIQ_KEY_ALIAS: ${{ env.ONIQ_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ONIQ_KEY_PASSWORD: ${{ env.ONIQ_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload release AAB
        if: steps.keystore_check.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oniq-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build signed APK
        if: steps.keystore_check.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE: ${{ github.workspace }}/android/app/oniq.keystore
          ORG_GRADLE_PROJECT_ONIQ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Verified values from the "Resolve signing credentials" step.
          ORG_GRADLE_PROJECT_ONIQ_KEY_ALIAS: ${{ env.ONIQ_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ONIQ_KEY_PASSWORD: ${{ env.ONIQ_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK
        if: steps.keystore_check.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oniq-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
